services:
  database:
    build: ./database
    container_name: mlops_database
    image: mlops_database:latest
    environment:
      POSTGRES_USER: mlops_user
      POSTGRES_PASSWORD: mlops_password
      POSTGRES_DB: mlops_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_user -d mlops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  models_api:
    build: ./models_api
    container_name: mlops_models_api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: mlops_user
      DB_PASSWORD: mlops_password
      DB_NAME: mlops_db
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./models_api:/app
      - ./database/data:/data
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  streamlit_app:
    build: ./streamlit_app
    container_name: mlops_streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://models_api:8000
    depends_on:
      - models_api
    volumes:
      - ./streamlit_app:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  postgres_data:
